<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <rect width="800" height="1000" fill="#17110F"/>
  <rect x="40" y="40" width="720" height="920" fill="#1a1310" stroke="#5A171B" stroke-width="1"/>
  <rect x="80" y="80" width="640" height="840" fill="#1e1612"/>
  <!-- Warm textured gradient -->
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8D2F24" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#C65A2E" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D49A32" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#17110F" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#5A171B" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect x="80" y="80" width="640" height="840" fill="url(#g1)"/>
  <rect x="80" y="80" width="640" height="840" fill="url(#g2)"/>
  <!-- Geometric block print motif -->
  <g opacity="0.15" stroke="#EEE5D5" stroke-width="1" fill="none">
    <line x1="200" y1="80" x2="200" y2="920"/>
    <line x1="600" y1="80" x2="600" y2="920"/>
    <line x1="80" y1="300" x2="720" y2="300"/>
    <line x1="80" y1="700" x2="720" y2="700"/>
  </g>
  <!-- Corner registration marks -->
  <g stroke="#C65A2E" stroke-width="1.5" opacity="0.7">
    <line x1="80" y1="80" x2="120" y2="80"/>
    <line x1="80" y1="80" x2="80" y2="120"/>
    <line x1="720" y1="80" x2="680" y2="80"/>
    <line x1="720" y1="80" x2="720" y2="120"/>
    <line x1="80" y1="920" x2="120" y2="920"/>
    <line x1="80" y1="920" x2="80" y2="880"/>
    <line x1="720" y1="920" x2="680" y2="920"/>
    <line x1="720" y1="920" x2="720" y2="880"/>
  </g>
  <!-- Placeholder label -->
  <text x="400" y="490" font-family="serif" font-size="14" fill="#EEE5D5" text-anchor="middle" opacity="0.4" letter-spacing="4">PHOTOGRAPH</text>
  <text x="400" y="520" font-family="serif" font-size="11" fill="#C65A2E" text-anchor="middle" opacity="0.5" letter-spacing="2">Add image to /public/images/</text>
</svg>
